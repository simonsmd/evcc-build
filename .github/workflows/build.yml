name: Build

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on:
  schedule: # runs on the default branch: master
    - cron: "0 2 * * *" # run at 2 AM UTC
  workflow_dispatch:

jobs:
  check_upstream:
    runs-on: ubuntu-latest
    name: Check latest commit/tag
    outputs:
      build_nightly: ${{ steps.check.outputs.build_nightly }}
      newest_release: ${{ steps.check.outputs.newest_release }}
      newest_build: ${{ steps.check.outputs.newest_build }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: "evcc-io/evcc"
          fetch-depth: 0
          fetch-tags: true

      - id: check
        name: check for new commits tags on upstream and fetch latest container build
        run: |
          test -z "$(git rev-list --after="24 hours" master)" && echo "build_nightly=false" | tee -a $GITHUB_OUTPUT
          echo "newest_release=$(git --no-pager log --tags --simplify-by-decoration --pretty="%D" --max-count 1  | grep -Po "\d+(.\d+(.\d+)?)?" | head -1)" | tee -a $GITHUB_OUTPUT
          # anonymous pull token, the package is public
          token=$(curl -sf "https://ghcr.io/token?scope=repository:${IMAGE_NAME}/evcc:pull" | jq -r .token)
          echo "newest_build=$(curl -sf https://ghcr.io/v2/${IMAGE_NAME}/evcc/tags/list -H "Authorization: Bearer $token" | jq -r '.tags | map(select(test("^\\d+\\.\\d+\\.\\d+$"))) | sort_by(split(".") | map(tonumber)) | last')" | tee -a $GITHUB_OUTPUT

  build-push-nightly-image:
    name: Build nightly image
    needs: check_upstream
    if: ${{ (needs.check_upstream.outputs.build_nightly != 'false') || (github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          repository: "evcc-io/evcc"

      - name: Install ast-grep
        run: npm install -g @ast-grep/cli@0.50.0

      - id: remove-sponsor-check
        name: Remove sponsor check
        run: |
          # remove every `if !sponsor.IsAuthorized() { ... }` block
          ast-grep run --lang go --pattern 'if !sponsor.IsAuthorized() { $$$ }' --rewrite '' \
            --globs '!*cloud*' --update-all ./charger ./server ./vehicle

          # drop imports that became unused
          git diff -z --name-only -- '*.go' | while read -r -d $'\0' file; do
            echo "$file"
            grep -q '\bsponsor\.' "$file" || sed -i '\#"github.com/evcc-io/evcc/util/sponsor"#d' "$file"
            grep -q '\bapi\.' "$file" || sed -i '\#"github.com/evcc-io/evcc/api"#d' "$file"
          done

      - name: Login
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/evcc:nightly
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-push-release-image:
    name: Build release image
    needs: check_upstream
    if: ${{ needs.check_upstream.outputs.newest_release != needs.check_upstream.outputs.newest_build || (github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          repository: "evcc-io/evcc"
          ref: ${{ needs.check_upstream.outputs.newest_release }}

      - name: Install ast-grep
        run: npm install -g @ast-grep/cli@0.50.0

      - id: remove-sponsor-check
        name: Remove sponsor check
        run: |
          # remove every `if !sponsor.IsAuthorized() { ... }` block, regardless of its body
          ast-grep run --lang go --pattern 'if !sponsor.IsAuthorized() { $$$ }' --rewrite '' \
            --globs '!*cloud*' --update-all ./charger ./server ./vehicle

          # drop imports that became unused
          git diff -z --name-only -- '*.go' | while read -r -d $'\0' file; do
            echo "$file"
            grep -q '\bsponsor\.' "$file" || sed -i '\#"github.com/evcc-io/evcc/util/sponsor"#d' "$file"
            grep -q '\bapi\.' "$file" || sed -i '\#"github.com/evcc-io/evcc/api"#d' "$file"
          done


      - name: Login
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/evcc
          context: git
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: RELEASE=1
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

